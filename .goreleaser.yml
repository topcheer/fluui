# .goreleaser.yml — Fluui release automation
# Usage: goreleaser release --clean
# Requires GITHUB_TOKEN environment variable.

project_name: fluui

before:
  hooks:
    - go mod tidy

builds:
  - id: fluui-demo
    main: ./cmd/demo
    binary: fluui-demo
    ldflags:
      - -s -w
      - -X github.com/topcheer/fluui.Version={{.Version}}
      - -X github.com/topcheer/fluui.Info.Commit={{.ShortCommit}}
      - -X github.com/topcheer/fluui.Info.Date={{.Date}}

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Co-Authored-By'

release:
  github:
    owner: topcheer
    name: fluui
  draft: true
  prerelease: auto
  name_template: "Fluui {{.Version}}"
  header: |
    ## Fluui {{.Version}}

    **{{.Summary}}**

    - **{{.ComponentCount}} components** | **23 terminal protocols**
    - 37/37 packages pass | 96%+ coverage | 90% zero-alloc Paint
