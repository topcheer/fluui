name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race
        run: go test -race -short -count=1 ./... -timeout 300s

      - name: Test coverage
        run: |
          go test -short -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
